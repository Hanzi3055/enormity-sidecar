name: Enormity Sidecar CI

on:
  push:
  pull_request:

jobs:
  sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run check
      - run: test -s OWNERSHIP.md
      - run: test -s ENGINEERING_STANDARD.md
      - run: test -s openapi.yaml
